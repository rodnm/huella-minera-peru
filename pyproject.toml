[project]
name = "huella-minera-peru"
version = "0.1.0"
description = "Atlas por distrito de la huella minera en el Perú, 2013-2025 (Tarea 3, Python Intermedio)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "blackmarblepy==2026.6.1",
    "coloraide>=4.0",
    "geopandas>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=11.0",
    "py7zr>=0.22",
    "pyarrow>=17.0",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.13",
    "shapely>=2.0",
    "statsmodels>=0.14",
    "streamlit==1.62.0",
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "dashboard"]
testpaths = ["tests"]
